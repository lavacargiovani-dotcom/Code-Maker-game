<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Code Maker Games</title><style>
*{box-sizing:border-box}body{margin:0;background:#070914;color:#fff;font-family:Inter,Arial,sans-serif;min-height:100vh;background-image:radial-gradient(circle at 20% 0%,#3036a944,transparent 32%),radial-gradient(circle at 90% 20%,#7b35c933,transparent 30%)}header{padding:34px 22px 18px;max-width:1250px;margin:auto}h1{font-size:clamp(38px,7vw,72px);margin:0;font-weight:900;letter-spacing:-3px;background:linear-gradient(90deg,#fff,#8c82ff);-webkit-background-clip:text;color:transparent}.sub{color:#aab1c8;margin:8px 0 24px}.bar{display:flex;gap:10px;flex-wrap:wrap}.search{flex:1;min-width:220px;background:#121627;border:1px solid #333a55;color:white;border-radius:14px;padding:14px 16px;font-size:16px;outline:none}.filter{padding:12px 15px;border-radius:12px;border:1px solid #3b4260;background:#151a2b;color:#ddd}.filter.active{background:#665cff;border-color:#877fff}.grid{max-width:1250px;margin:0 auto;padding:15px 22px 45px;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}.card{position:relative;overflow:hidden;min-height:175px;border:1px solid #303750;border-radius:18px;background:linear-gradient(145deg,#171d31,#0f1320);padding:17px;transition:.2s;cursor:pointer}.card:hover{transform:translateY(-5px);border-color:#746aff;box-shadow:0 15px 35px #0008}.num{font-size:11px;color:#777f9d;font-weight:800}.icon{font-size:42px;margin:15px 0 8px}.title{font-size:19px;font-weight:850}.play{position:absolute;right:13px;bottom:13px;background:#6258ee;border-radius:10px;padding:7px 10px;font-size:12px;font-weight:bold}.featured{grid-column:1/-1;min-height:135px;background:linear-gradient(110deg,#251d54,#101629);display:flex;align-items:center;gap:20px}.featured .icon{font-size:64px;margin:0}.empty{grid-column:1/-1;text-align:center;padding:60px;color:#8991aa}@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);padding:12px}.card{min-height:155px}.featured{grid-column:1/-1}.icon{font-size:34px}}

function render(){let q=search.value.toLowerCase();let arr=games.filter(g=>g[2].toLowerCase().includes(q));if(filter==='rpg')arr=[];grid.innerHTML='';if(filter==='all'&&!q){let c=document.createElement('div');c.className='card featured';c.innerHTML='<div class="icon">⚔️</div><div><div class="num">JOGO ESPECIAL</div><div class="title">Crônicas da Masmorra — Arena Infinita</div><div class="sub">RPG de ação com combate, inimigos, habilidades e controles para celular.</div></div><div class="play">JOGAR ▶</div>';c.onclick=()=>location.href='rpg_masmorra.html';grid.appendChild(c)}if(filter==='rpg'&&!q){let c=document.createElement('div');c.className='card featured';c.innerHTML='<div class="icon">⚔️</div><div><div class="num">RPG</div><div class="title">Crônicas da Masmorra — Arena Infinita</div><div class="sub">Entrar na masmorra.</div></div><div class="play">JOGAR ▶</div>';c.onclick=()=>location.href='rpg_masmorra.html';grid.appendChild(c);return}if(!arr.length&&!grid.children.length){grid.innerHTML='<div class="empty">Nenhum jogo encontrado.</div>';return}arr.forEach(g=>{let c=document.createElement('div');c.className='card';c.innerHTML='<div class="num">JOGO '+String(g[0]).padStart(3,'0')+'</div><div class="icon">'+(icons[g[0]-1]||'🎮')+'</div><div class="title">'+g[2]+'</div><div class="play">JOGAR ▶</div>';c.onclick=()=>location.href='jogos/'+g[1];grid.appendChild(c)})}
